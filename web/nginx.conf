server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NOT be cached: it is what points at the new asset hashes
  # after a deploy, and a cached copy pins staff to the old build.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # API and websockets proxied to the backend, so the browser sees one origin
  # and CORS never applies to the panel.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Product images. Same-origin on purpose: an <img> cannot send custom
  # headers, so it cannot carry a tunnel-bypass header or a bearer token, and a
  # panel on https loading images from an http host is mixed content. The web
  # client rewrites stored absolute URLs to this path (see src/lib/image.ts).
  #
  # With STORAGE_PROVIDER=s3 the API serves no /static and this rule is inert;
  # image URLs then point at the CDN and are used as-is.
  location /static/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 7d;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA fallback — every non-file route is handled by the router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
