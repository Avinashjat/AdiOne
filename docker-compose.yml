# Local development infrastructure for AdiOne.
#
# NOTE: Docker is optional for this project. The developer machine currently
# runs PostgreSQL natively on :5432 and has no Redis, so the API defaults to
# REDIS=false. Use this file when you want reproducible infra instead.
#
#   docker compose up -d
#   # then set in .env:
#   #   DATABASE_URL=postgresql://postgres:admin@localhost:5433/adione
#   #   REDIS=true
#
# Postgres is mapped to 5433 on purpose so it does not collide with a natively
# installed Postgres already listening on 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: adione-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-adione}
    ports:
      - "5433:5432"
    volumes:
      - adione_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-adione}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: adione-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - adione_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for product images in dev.
  # Console: http://localhost:9001  (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: adione-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - adione_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  adione_pgdata:
  adione_redisdata:
  adione_miniodata:


